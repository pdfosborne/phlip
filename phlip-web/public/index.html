<!-- main app: lands on the personal space immediately, no server required -->
<div id="app" class="on">
  <nav class="rail" id="rail" aria-label="Groups"></nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button type="button" class="side-server-menu-btn" id="side-server-menu-btn" aria-haspopup="dialog" aria-expanded="false">
        <h2 id="group-name"></h2>
        <span class="side-server-menu-chevron" aria-hidden="true"></span>
      </button>
      <p class="side-connection-status" id="side-connection-status" hidden></p>
      <div class="sidebar-head-host-row" id="sidebar-head-host-row">
        <button type="button" class="side-host-reach" id="side-device-chip" hidden></button>
      </div>
    </div>
    <div class="sidebar-body">
      <div class="sidebar-scroll" id="side-list"></div>
    </div>
    <div class="side-user-panel" id="side-user-panel"></div>
    <!-- Fills the left sidebar (not the right channel panel). -->
    <div class="side-overlay" id="side-overlay" hidden aria-hidden="true">
      <div class="side-overlay-head">
        <button type="button" class="side-overlay-back" id="side-overlay-back" aria-label="Back"></button>
        <h3 id="side-overlay-title">Server settings</h3>
        <div class="side-overlay-actions" id="side-overlay-actions" hidden></div>
      </div>
      <div class="side-overlay-body" id="side-overlay-body"></div>
    </div>
  </aside>

  <div class="channel-panel-scrim" id="channel-panel-scrim" aria-hidden="true"></div>
  <aside class="channel-panel" id="channel-panel" aria-label="My calendar" aria-hidden="true">
    <div class="channel-panel-head">
      <button type="button" class="channel-panel-back" id="channel-panel-back" hidden aria-label="Back"></button>
      <div class="channel-panel-head-copy">
        <h3 id="channel-panel-title">Channel</h3>
        <p class="channel-panel-sub" id="channel-panel-sub" hidden>All your accepted events</p>
      </div>
      <div class="channel-panel-tabs-top" id="channel-panel-tabs-top" role="tablist" aria-label="Panel tools">
        <button type="button" class="channel-panel-tab is-icon" role="tab" data-panel-tab="calendar" id="channel-panel-tab-calendar" aria-selected="false" aria-label="My calendar" title="My calendar"></button>
        <button type="button" class="channel-panel-tab is-icon" role="tab" data-panel-tab="people" id="channel-panel-tab-people" aria-selected="false" aria-label="People" title="People" hidden></button>
        <button type="button" class="channel-panel-tab is-icon is-trail" role="tab" data-panel-tab="notifications" id="channel-panel-tab-notifications" aria-selected="false" aria-label="Notifications" title="Notifications"></button>
      </div>
      <button type="button" class="channel-panel-close" id="channel-panel-close" hidden aria-label="Close"></button>
    </div>
    <div class="channel-panel-body" id="channel-panel-body"></div>
    <div class="channel-panel-app" id="channel-panel-app"></div>
    <div class="channel-panel-tabs" id="channel-panel-tabs" role="tablist" aria-label="Panel feed" hidden>
      <button type="button" class="channel-panel-tab is-icon" role="tab" data-panel-tab="description" id="channel-panel-tab-description" aria-selected="false" aria-label="Description" title="Description"></button>
      <button type="button" class="channel-panel-tab is-icon" role="tab" data-panel-tab="events" id="channel-panel-tab-events" aria-selected="false" aria-label="Events" title="Events"></button>
      <button type="button" class="channel-panel-tab is-icon" role="tab" data-panel-tab="chat" id="channel-panel-tab-chat" aria-selected="false" aria-label="Chat" title="Chat"></button>
    </div>
  </aside>

  <main class="main">
    <header class="main-head">
      <button type="button" class="back" id="btn-back" aria-label="Back to servers and channels"></button>
      <div class="head-center" id="board-title-btn" aria-expanded="false" aria-controls="board-options">
        <h3 id="view-title"></h3>
        <span class="view-link-marks" id="view-link-marks" hidden></span>
        <span class="board-member-line">
          <span class="sub" id="view-sub"></span>
          <span class="board-title-chev" id="board-title-chev" hidden aria-hidden="true"></span>
        </span>
      </div>
      <div class="head-actions" id="head-actions">
        <button type="button" class="head-icon-btn" id="quick-manage" aria-label="Quick manage" title="Quick manage" hidden></button>
        <button type="button" class="head-icon-btn" id="channel-info-btn" aria-label="My calendar" title="My calendar" hidden></button>
      </div>
      <div class="board-options" id="board-options" hidden role="dialog" aria-label="Board options"></div>
    </header>
    <div class="board-nav-row" id="board-nav-row" hidden>
      <button type="button" class="board-back-chat" id="board-back-chat" hidden>Back to chat</button>
      <nav class="board-event-tabs" id="board-event-tabs" role="tablist" aria-label="Conversation views"></nav>
    </div>
    <div class="reconnect" id="reconnect">Syncing with host…</div>
    <div id="view"></div>
  </main>
</div>
