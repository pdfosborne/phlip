name: Phlip
options:
  bundleIdPrefix: app.phlip
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Phlip:
    type: application
    platform: iOS
    sources:
      - path: Phlip/Sources
    resources:
      - path: ../phlip-web/public
        type: folder
        optional: false
      - path: Phlip/Resources/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.phlip.ios
        INFOPLIST_FILE: Phlip/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: false
  PhlipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Phlip/Tests
    dependencies:
      - target: Phlip
  PhlipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Phlip/UITests
    dependencies:
      - target: Phlip
