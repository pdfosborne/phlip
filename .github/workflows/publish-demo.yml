name: Publish demo

on:
  push:
    branches: [main]
    paths:
      - "phlip-web/public/**"
      - "phlip-web/demo-host/**"
      - ".github/workflows/publish-demo.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: phlip-web/demo-host
