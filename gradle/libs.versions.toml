# Dependency and plugin versions for the Phlip monorepo.

[versions]
agp = "8.2.0"
kotlin = "1.9.22"
coroutines = "1.7.3"
androidxCoreKtx = "1.12.0"
androidxAppcompat = "1.6.1"
androidxSplashscreen = "1.0.1"
material = "1.11.0"
webkit = "1.10.0"
profileinstaller = "1.3.1"
playAppUpdate = "2.1.0"
espresso = "3.5.1"
nanohttpd = "2.3.1"
gson = "2.10.1"
junit = "4.13.2"
robolectric = "4.11.1"
okhttp = "4.12.0"
androidxTestExtJunit = "1.1.5"
androidxTestRunner = "1.5.2"
androidxTestRules = "1.5.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
